services:
  - type: web
    name: meuhumor-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__ConnectionString
        sync: false
      - key: Supabase__Url
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
